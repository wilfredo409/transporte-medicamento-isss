<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ISSS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">
    <div class="bg-white rounded-xl shadow-2xl w-96 overflow-hidden">
        <div class="bg-[#1e3a8a] p-6 text-white text-center font-bold uppercase">ISSS Trazabilidad</div>
        <div class="p-8 space-y-4">
            <input id="email" type="email" placeholder="Usuario" class="w-full border p-3 rounded">
            <input id="pass" type="password" placeholder="Contraseña" class="w-full border p-3 rounded">
            <button onclick="login()" class="w-full bg-[#1e3a8a] text-white py-3 rounded font-bold">INGRESAR</button>
        </div>
    </div>
    <script>
        async function login() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('pass').value })
            });
            const data = await res.json();
            if(res.ok) {
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = data.redirect;
            } else { alert("Error"); }
        }
    </script>
</body>
</html>
