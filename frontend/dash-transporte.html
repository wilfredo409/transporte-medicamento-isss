<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Transporte ISSS - Rutas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 flex h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-[#1e293b] text-slate-300 flex flex-col shadow-xl">
        <div class="p-6 bg-[#0f172a] text-white font-bold text-center">ISSS LOGÍSTICA</div>
        <nav class="flex-1 mt-4">
            <a href="#" class="block px-6 py-4 bg-orange-600 text-white font-bold"> <i class="fas fa-truck mr-2"></i> Mis Rutas</a>
            <a href="#" class="block px-6 py-4 hover:bg-slate-800"> <i class="fas fa-history mr-2"></i> Historial</a>
        </nav>
        <div class="p-4 border-t border-slate-700">
            <p id="display-name" class="text-xs font-bold text-white"></p>
            <button onclick="location.href='index.html'" class="text-xs text-red-400 mt-2 hover:underline">Cerrar Sesión</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black text-slate-800 uppercase italic">Control de Carga en Tránsito</h1>
            <div class="bg-orange-100 text-orange-700 px-4 py-2 rounded-full text-xs font-bold animate-pulse">
                <i class="fas fa-signal"></i> GPS ACTIVO
            </div>
        </header>

        <div id="grid-rutas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Las tarjetas se cargan aquí -->
        </div>
    </main>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        document.getElementById('display-name').innerText = user.nombre_completo;

        async function loadRutas() {
            const res = await fetch(`/api/ordenes/lista/TRANSPORTISTA/${user.id}`);
            const data = await res.json();
            
            document.getElementById('grid-rutas').innerHTML = data.map(o => {
                const tieneFrio = o.productos.some(p => p.frio);
                const esEnRuta = o.estado_id === 2;

                return `
                <div class="bg-white p-6 rounded-2xl shadow-lg border-l-8 ${esEnRuta ? 'border-orange-500' : 'border-blue-900'} relative">
                    ${tieneFrio ? '<div class="absolute top-2 right-2 text-blue-500 font-black text-[10px] italic">❄️ CARGA FRÍA</div>' : ''}
                    <p class="text-[10px] font-black text-slate-400 mb-2 uppercase">${o.codigo_trz} | ${o.numero_pedido}</p>
                    <p class="text-xs font-bold text-blue-600 uppercase">Destino:</p>
                    <p class="font-black text-gray-800 text-lg mb-4 leading-tight">${o.destino_nombre}</p>
                    
                    <div class="bg-slate-50 p-3 rounded-xl text-[10px] mb-4">
                        <p class="font-bold border-b mb-1">CONTENIDO:</p>
                        ${o.productos.map(p => `• ${p.nombre} (${p.cantidad})`).join('<br>')}
                    </div>

                    ${!esEnRuta ? 
                        `<button onclick="actualizarEstado(${o.id}, 2, 'EN_RUTA')" class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-orange-600 transition">INICIAR RUTA</button>` 
                        : `<div class="text-center py-2 bg-orange-100 text-orange-700 rounded-lg font-bold text-xs">EN TRAYECTO...</div>`
                    }
                </div>`;
            }).join('');
        }

        async function actualizarEstado(id, eid, nombre) {
            await fetch('/api/ordenes/estado', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ orden_id: id, nuevo_estado_id: eid, nombre_estado: nombre })
            });
            loadRutas();
        }

        loadRutas();
    </script>
</body>
</html>
