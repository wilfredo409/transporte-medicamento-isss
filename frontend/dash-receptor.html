<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recepción ISSS - Confirmación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 flex h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-[#0f172a] text-slate-300 flex flex-col shadow-xl">
        <div class="p-6 bg-blue-900 text-white font-bold text-center italic">ISSS RECEPCIÓN</div>
        <nav class="flex-1 mt-4">
            <a href="#" class="block px-6 py-4 bg-green-700 text-white font-bold"> <i class="fas fa-file-signature mr-2"></i> Por Recibir</a>
            <a href="#" class="block px-6 py-4 hover:bg-slate-800"> <i class="fas fa-archive mr-2"></i> Recibidos</a>
        </nav>
        <div class="p-4 border-t border-slate-700">
            <p id="display-name" class="text-xs font-bold text-white"></p>
            <button onclick="location.href='index.html'" class="text-xs text-red-400 mt-2 hover:underline">Cerrar Sesión</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
        <h1 class="text-2xl font-black text-slate-800 uppercase mb-8">Pedidos en Camino a esta Unidad</h1>

        <div id="grid-recepcion" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Pedidos por recibir -->
        </div>
    </main>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        document.getElementById('display-name').innerText = user.nombre_completo;

        async function loadPedidos() {
            // El receptor ve lo que está "EN RUTA" (estado 2)
            const res = await fetch(`/api/ordenes/lista/RECEPTOR/${user.id}`);
            const data = await res.json();
            
            // Filtramos solo los que están en ruta para recibirlos
            const pendientes = data.filter(o => o.estado_id === 2);

            document.getElementById('grid-recepcion').innerHTML = pendientes.map(o => `
                <div class="bg-white p-8 rounded-3xl shadow-xl border-t-8 border-orange-500">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase">${o.codigo_trz}</p>
                            <h3 class="text-lg font-bold text-slate-800">Cargamento: ${o.numero_pedido}</h3>
                        </div>
                        <span class="bg-orange-100 text-orange-600 text-[10px] px-3 py-1 rounded-full font-bold">EN RUTA</span>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl mb-6">
                        <p class="text-xs font-bold text-slate-500 mb-2 uppercase">Medicamentos incluidos:</p>
                        <ul class="text-sm space-y-1">
                            ${o.productos.map(p => `<li><i class="fas fa-box text-blue-400 mr-2"></i> ${p.nombre} - <span class="font-bold">${p.cantidad}</span></li>`).join('')}
                        </ul>
                    </div>

                    <div class="space-y-3">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Nombre de quien recibe (Firma Digital):</label>
                        <input id="firma-${o.id}" type="text" placeholder="Escriba su nombre completo" class="w-full border-2 p-3 rounded-xl focus:border-green-500 outline-none font-bold">
                        <button onclick="confirmarEntrega(${o.id})" class="w-full bg-green-600 text-white font-black py-4 rounded-xl shadow-lg hover:bg-green-700 transition uppercase">Confirmar Recepción Digital</button>
                    </div>
                </div>
            `).join('');

            if(pendientes.length === 0) {
                document.getElementById('grid-recepcion').innerHTML = `<div class="col-span-2 text-center py-20 text-slate-400 font-bold italic">No hay pedidos en tránsito hacia esta unidad actualmente.</div>`;
            }
        }

        async function confirmarEntrega(id) {
            const firma = document.getElementById(`firma-${id}`).value;
            if(!firma) return alert("Debe ingresar el nombre de la persona que recibe para la auditoría.");

            await fetch('/api/ordenes/estado', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    orden_id: id, 
                    nuevo_estado_id: 3, 
                    nombre_estado: 'ENTREGADO',
                    firma: firma 
                })
            });
            alert("¡ENTREGA CONFIRMADA! La información se ha enviado a Gerencia.");
            loadPedidos();
        }

        loadPedidos();
    </script>
</body>
</html>
