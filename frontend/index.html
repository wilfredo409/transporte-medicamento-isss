<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ISSS Trazabilidad Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- LOGIN -->
    <div id="view-login" class="flex items-center justify-center h-screen bg-gradient-to-br from-blue-900 to-blue-700">
        <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md">
            <img src="https://www.isss.gob.sv/wp-content/uploads/2021/04/logo-isss.png" class="h-20 mx-auto mb-6">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-8">Sistema de Trazabilidad</h1>
            <div class="space-y-4">
                <input id="email" type="email" placeholder="Usuario Institucional" class="w-full border-2 p-3 rounded-xl focus:border-blue-500 outline-none">
                <input id="pass" type="password" placeholder="Contraseña" class="w-full border-2 p-3 rounded-xl focus:border-blue-500 outline-none">
                <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg uppercase">Entrar al Sistema</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="view-app" class="hidden">
        <nav class="bg-white border-b p-4 flex justify-between items-center px-8 shadow-sm">
            <div class="flex items-center gap-3">
                <img src="https://cdn-icons-png.flaticon.com/512/822/822143.png" class="h-8">
                <span class="font-black text-blue-900 tracking-tighter text-xl italic">ISSS LOGÍSTICA</span>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right">
                    <p id="user-name" class="font-bold text-gray-800 leading-none"></p>
                    <span id="user-role" class="text-xs text-blue-600 font-bold uppercase tracking-widest"></span>
                </div>
                <button onclick="location.reload()" class="bg-red-50 text-red-600 p-2 rounded-full hover:bg-red-100"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </nav>

        <main class="p-8 max-w-6xl mx-auto">
            
            <!-- SECCION FARMACIA -->
            <div id="role-farmacia" class="hidden space-y-6">
                <h2 class="text-3xl font-bold text-gray-800">Despacho de Medicamentos</h2>
                <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-4">
                        <label class="block font-bold text-gray-600 text-sm">NÚMERO DE PEDIDO / REQUISICIÓN</label>
                        <input id="num-pedido" type="text" placeholder="Ej: PED-2026-001" class="w-full border-2 p-3 rounded-xl">
                        
                        <label class="block font-bold text-gray-600 text-sm">UNIDAD MÉDICA DESTINO</label>
                        <select id="select-unidades" class="w-full border-2 p-3 rounded-xl bg-gray-50"></select>
                    </div>
                    <div class="space-y-4">
                        <label class="block font-bold text-gray-600 text-sm">TRANSPORTISTA ASIGNADO</label>
                        <select id="select-trans" class="w-full border-2 p-3 rounded-xl bg-gray-50"></select>
                        
                        <div class="pt-8">
                            <button onclick="crearOrden()" class="w-full bg-green-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-green-700 transition-all">GENERAR GUÍA DIGITAL TRZ</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECCION TRANSPORTISTA / RECEPTOR -->
            <div id="role-lista" class="hidden space-y-6">
                <h2 id="lista-titulo" class="text-3xl font-bold text-gray-800">Cargamento en Proceso</h2>
                <div id="contenedor-ordenes" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>

            <!-- SECCION GERENTE -->
            <div id="role-gerente" class="hidden space-y-8">
                <h2 class="text-3xl font-bold text-gray-800">Indicadores Clave (KPIs)</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="bg-white p-8 rounded-3xl shadow-xl border-t-8 border-blue-600">
                        <p class="text-gray-400 font-bold text-xs uppercase mb-2">Total Despachos</p>
                        <p id="stat-total" class="text-6xl font-black text-gray-800">0</p>
                    </div>
                    <div class="bg-white p-8 rounded-3xl shadow-xl border-t-8 border-orange-500">
                        <p class="text-gray-400 font-bold text-xs uppercase mb-2">Pedidos en Ruta</p>
                        <p id="stat-ruta" class="text-6xl font-black text-gray-800">0</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        const API = "https://transporte-medicamento-isss.onrender.com/api"; // CAMBIA POR TU URL
        let user = null;

        async function login() {
            const res = await fetch(`${API}/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('pass').value })
            });
            if(res.ok) {
                user = await res.json();
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-app').classList.remove('hidden');
                document.getElementById('user-name').innerText = user.nombre_completo;
                document.getElementById('user-role').innerText = user.nombre_rol;
                
                if(user.nombre_rol === 'FARMACIA') { cargarCatalogos(); document.getElementById('role-farmacia').classList.remove('hidden'); }
                if(user.nombre_rol === 'TRANSPORTISTA' || user.nombre_rol === 'RECEPTOR') { 
                    document.getElementById('role-lista').classList.remove('hidden'); 
                    document.getElementById('lista-titulo').innerText = user.nombre_rol === 'TRANSPORTISTA' ? 'Mis Rutas Asignadas' : 'Pedidos por Recibir';
                    cargarOrdenes(); 
                }
                if(user.nombre_rol === 'GERENTE') { document.getElementById('role-gerente').classList.remove('hidden'); cargarStats(); }
            } else { alert("Error de acceso"); }
        }

        async function cargarCatalogos() {
            const res = await fetch(`${API}/catalogos`);
            const data = await res.json();
            document.getElementById('select-unidades').innerHTML = data.unidades.map(u => `<option value="${u.id}">${u.nombre}</option>`).join('');
            document.getElementById('select-trans').innerHTML = data.transportistas.map(t => `<option value="${t.id}">${t.nombre_completo}</option>`).join('');
        }

        async function crearOrden() {
            const res = await fetch(`${API}/ordenes`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    numero_pedido: document.getElementById('num-pedido').value,
                    destino_id: document.getElementById('select-unidades').value,
                    transportista_id: document.getElementById('select-trans').value,
                    creador_id: user.id
                })
            });
            const data = await res.json();
            alert("¡ÉXITO! Guía Generada: " + data.codigo_trz);
            document.getElementById('num-pedido').value = "";
        }

        async function cargarOrdenes() {
            const res = await fetch(`${API}/ordenes/lista/${user.nombre_rol}/${user.id}`);
            const data = await res.json();
            const btnColor = user.nombre_rol === 'TRANSPORTISTA' ? 'bg-orange-500' : 'bg-green-600';
            const btnText = user.nombre_rol === 'TRANSPORTISTA' ? 'INICIAR RUTA' : 'CONFIRMAR ENTREGA';
            const nextEstado = user.nombre_rol === 'TRANSPORTISTA' ? 2 : 3;

            document.getElementById('contenedor-ordenes').innerHTML = data.map(o => `
                <div class="bg-white p-6 rounded-3xl shadow-lg border-l-8 border-blue-900">
                    <div class="flex justify-between mb-4">
                        <span class="text-xs font-black text-blue-900 bg-blue-50 px-3 py-1 rounded-full uppercase">${o.codigo_trz}</span>
                        <span class="text-xs font-bold text-gray-400">PEDIDO: ${o.numero_pedido}</span>
                    </div>
                    <p class="text-sm text-gray-500 font-bold uppercase mb-1">Destino:</p>
                    <p class="font-black text-gray-800 mb-4">${o.unidad_nombre}</p>
                    <button onclick="cambiarEstado(${o.id}, ${nextEstado})" class="w-full ${btnColor} text-white py-3 rounded-2xl font-bold shadow-md hover:opacity-90">${btnText}</button>
                </div>
            `).join('');
        }

        async function cambiarEstado(id, nuevo) {
            await fetch(`${API}/ordenes/estado`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ orden_id: id, nuevo_estado_id: nuevo })
            });
            alert("Estado de pedido actualizado");
            cargarOrdenes();
        }

        async function cargarStats() {
            const res = await fetch(`${API}/stats`);
            const data = await res.json();
            document.getElementById('stat-total').innerText = data.total;
            document.getElementById('stat-ruta').innerText = data.en_ruta;
        }
    </script>
</body>
</html>
